plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vipul.discipline'
    compileSdk 34

    defaultConfig {
        applicationId 'com.vipul.discipline'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '2.0'
    }

    signingConfigs {
        arg {
            storeFile file('arg.keystore')
            storePassword 'argapp2026'
            keyAlias 'arg'
            keyPassword 'argapp2026'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.arg }
        release { minifyEnabled false; signingConfig signingConfigs.arg }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError false; checkReleaseBuilds false }
}
